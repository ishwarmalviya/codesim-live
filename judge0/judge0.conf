################################################################################
# Judge0 CE — self-hosted config for CodeSim (Docker Compose)
################################################################################

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_dev_pw

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_pg_dev_pw

# Disable telemetry in local dev
JUDGE0_TELEMETRY_ENABLE=false

# Sync wait for submission results (required for CodeSim run/submit)
ENABLE_WAIT_RESULT=true

# Sandbox limits — align with CodeSim 10s timeout
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=256000

# No auth token for local self-hosted instance
AUTHN_HEADER=
AUTHN_TOKEN=

RAILS_ENV=production
